<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>My Orders | Nexus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-900">
<nav class="bg-gray-900 text-white p-3 flex items-center justify-between shadow-lg">
  <a href="/" class="flex items-center gap-2 mx-4"><i class="fa-solid fa-microchip text-yellow-400 text-2xl"></i><span class="font-bold text-xl">NEXUS</span></a>
  <div class="flex items-center gap-6 mr-4">
    <a href="/my-orders" class="font-bold text-yellow-400 text-sm"><i class="fa-solid fa-box mr-1"></i> My Orders</a>
    <a href="/cart" class="font-bold hover:text-yellow-400 text-sm"><i class="fa-solid fa-cart-shopping mr-1"></i> Cart</a>
    <form th:action="@{/logout}" method="post"><button class="font-bold hover:text-yellow-400 text-sm">Log Out</button></form>
  </div>
</nav>

<div class="max-w-screen-xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-black mb-6"><i class="fa-solid fa-box-open mr-3"></i>Order History</h1>

  <div th:if="${#lists.isEmpty(orders)}" class="bg-white p-8 rounded-xl shadow-sm text-center">
    <p class="text-gray-500 text-lg">You haven't placed any orders yet.</p>
    <a href="/" class="mt-4 inline-block bg-yellow-400 font-bold py-2 px-6 rounded-full">Start Shopping</a>
  </div>

  <div class="space-y-4">
    <div th:each="order : ${orders}" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
      <div>
        <p class="text-sm text-gray-500 font-bold uppercase mb-1" th:text="'Order #' + ${order.id}"></p>
        <p class="text-2xl font-black text-gray-900" th:text="'$' + ${order.totalAmount}"></p>
      </div>
      <div class="md:text-right">
        <span class="inline-block bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full uppercase mb-2" th:text="${order.status}"></span>
        <p class="text-sm text-gray-500" th:text="'Paid via: ' + ${order.paymentMethod}"></p>
        <p class="text-sm text-gray-500" th:text="'Shipped to: ' + ${order.shippingAddress}"></p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
