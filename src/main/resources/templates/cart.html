<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Your Cart | Nexus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-900">
<nav class="bg-gray-900 text-white p-3 flex items-center justify-between shadow-lg">
  <a href="/" class="flex items-center gap-2 mx-4"><i class="fa-solid fa-microchip text-yellow-400 text-2xl"></i><span class="font-bold text-xl">NEXUS</span></a>
  <div class="flex items-center gap-6 mr-4">
    <a href="/my-orders" class="font-bold hover:text-yellow-400 text-sm"><i class="fa-solid fa-box mr-1"></i> My Orders</a>
    <a href="/cart" class="font-bold text-yellow-400 text-sm"><i class="fa-solid fa-cart-shopping mr-1"></i> Cart</a>
    <form th:action="@{/logout}" method="post"><button class="font-bold hover:text-yellow-400 text-sm">Log Out</button></form>
  </div>
</nav>

<div class="max-w-screen-xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-black mb-6"><i class="fa-solid fa-cart-shopping mr-3"></i>Your Cart</h1>

  <div th:if="${#lists.isEmpty(cart)}" class="bg-white p-12 rounded-xl shadow-sm text-center border border-gray-200">
    <i class="fa-solid fa-cart-arrow-down text-6xl text-gray-300 mb-4"></i>
    <p class="text-gray-500 text-xl font-bold">Your cart is empty.</p>
    <a href="/" class="mt-6 inline-block bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-3 px-8 rounded-full transition">Browse Products</a>
  </div>

  <div th:if="${!#lists.isEmpty(cart)}" class="flex flex-col md:flex-row gap-8">
    <div class="flex-1 space-y-4">
      <div th:each="product : ${cart}" class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex items-center gap-4">
        <img th:src="${product.imageUrl}" class="w-24 h-24 object-cover rounded-md">
        <div class="flex-1">
          <h3 class="font-bold text-lg" th:text="${product.name}"></h3>
          <p class="text-sm text-blue-600 font-semibold uppercase" th:text="${product.category}"></p>
        </div>
        <div class="text-xl font-black" th:text="'$' + ${product.price}"></div>
      </div>
      <div class="text-right">
        <a href="/cart/clear" class="text-red-500 hover:underline text-sm font-bold"><i class="fa-solid fa-trash mr-1"></i>Empty Cart</a>
      </div>
    </div>

    <div class="w-full md:w-80 bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit sticky top-6">
      <h3 class="font-bold text-xl mb-4 border-b pb-2">Order Summary</h3>
      <div class="flex justify-between mb-2 text-gray-600"><span>Subtotal</span><span th:text="'$' + ${total}"></span></div>
      <div class="flex justify-between mb-4 text-gray-600"><span>Shipping</span><span class="text-green-600 font-bold">FREE</span></div>
      <div class="flex justify-between border-t pt-4 mb-6 text-2xl font-black"><span>Total</span><span th:text="'$' + ${total}"></span></div>
      <a href="/checkout-confirm" class="block text-center w-full bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-3 rounded-md shadow transition">Proceed to Checkout</a>
    </div>
  </div>
</div>
</body>
</html>
