<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Nexus Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen py-10">
<div class="mb-6 flex items-center gap-2 cursor-pointer">
  <i class="fa-solid fa-microchip text-blue-600 text-3xl"></i>
  <span class="font-bold text-3xl tracking-wider text-gray-900">NEXUS</span>
</div>
<div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200 w-96">
  <h2 class="text-2xl font-semibold mb-6">Create account</h2>

  <div th:if="${param.error != null and param.error[0] == 'invalid_otp'}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-3 mb-4 text-sm">Incorrect OTP. Please try again.</div>
  <div th:if="${param.error != null and param.error[0] == 'email_exists'}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-3 mb-4 text-sm">Email already registered.</div>

  <form th:action="@{/register}" method="post" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Your name</label>
      <input type="text" name="name" placeholder="First and last name" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none" required>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Mobile number or email</label>
      <input type="email" name="email" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none" required>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input type="password" name="password" placeholder="At least 6 characters" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none" required>
    </div>

    <div class="pt-2 border-t border-gray-200 mt-4">
      <button type="button" onclick="sendDummyOTP()" class="w-full bg-blue-100 hover:bg-blue-200 text-blue-800 font-semibold py-2 rounded-md transition text-sm mb-3">
        <i class="fa-solid fa-mobile-screen-button mr-2"></i>Send OTP
      </button>

      <div id="otpContainer" class="hidden">
        <label class="block text-sm font-bold text-gray-700 mb-1">Enter OTP (1234)</label>
        <input type="text" name="otp" id="otpInput" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 outline-none tracking-widest text-center font-bold" required>
        <button type="submit" class="w-full mt-4 bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-2 rounded-lg shadow-sm transition">Verify and Create Account</button>
      </div>
    </div>
  </form>
  <p class="text-xs text-gray-500 mt-4">By creating an account, you agree to Nexus's Conditions of Use and Privacy Notice.</p>
</div>
<div class="mt-6 text-sm">
  Already have an account? <a th:href="@{/login}" class="text-blue-600 hover:underline font-medium">Sign in <i class="fa-solid fa-caret-right text-xs"></i></a>
</div>

<script>
  function sendDummyOTP() {
    alert("NEXUS DEMO: Your verification OTP code is 1234. Do not share this with anyone.");
    document.getElementById('otpContainer').classList.remove('hidden');
    document.getElementById('otpInput').focus();
  }
</script>
</body>
</html>
